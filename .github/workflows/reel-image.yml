# Builds the reel runner image (tools/reel/Dockerfile) and publishes it to GitHub's registry as
# ghcr.io/desitrain22/nsds-reel:latest, which reel.yml runs inside. Rebuilt only when its inputs
# change, or by hand.

name: reel-image

on:
  push:
    branches: [main]
    paths:
      - 'tools/reel/Dockerfile'
      - 'tools/reel/requirements.txt'
      - 'tools/carousel/**'
      - '.github/workflows/reel-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/reel/Dockerfile
          push: true
          tags: ghcr.io/desitrain22/nsds-reel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
