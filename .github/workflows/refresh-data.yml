name: Refresh site data

# Pulls upcoming shows off Luma and recent posts off Instagram into
# data/site.json, then commits the result so GitHub Pages serves it as a
# static file. The page never calls either API directly — doing so from the
# browser would fail CORS and expose us to their rate limits on every visit.
on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours, off the hour to dodge the stampede
  workflow_dispatch: # lets you force a refresh from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-data.mjs'
      - '.github/workflows/refresh-data.yml'
      # Adding or removing the hero loop flips a flag in site.json, so pick it
      # up immediately instead of waiting for the next scheduled run.
      - 'media/hero.mp4'

# Prevent overlapping runs from racing each other's commits.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Luma + Instagram
        # Without IG_TOKEN the script falls back to the endpoint instagram.com
        # itself calls, which answers from a laptop but 429s from a runner's
        # datacenter IP. Luma needs no credentials either way.
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/fetch-data.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.json data/site.js media/ig
          # fetch-data.mjs leaves the file untouched when nothing meaningful
          # moved, so an empty diff here genuinely means "nothing to publish".
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh shows + instagram [skip ci]"
            git push
          fi
